<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
    <linearGradient id="icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38BDF8"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <linearGradient id="dot1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#EF4444"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bg)"/>

  <!-- Canvas frame -->
  <rect x="12" y="12" width="40" height="40" rx="4" ry="4" fill="none" stroke="url(#icon)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Grid pattern (canvas texture) -->
  <line x1="12" y1="25" x2="52" y2="25" stroke="#38BDF8" stroke-width="0.8" opacity="0.4"/>
  <line x1="12" y1="38" x2="52" y2="38" stroke="#38BDF8" stroke-width="0.8" opacity="0.4"/>
  <line x1="25" y1="12" x2="25" y2="52" stroke="#38BDF8" stroke-width="0.8" opacity="0.4"/>
  <line x1="38" y1="12" x2="38" y2="52" stroke="#38BDF8" stroke-width="0.8" opacity="0.4"/>

  <!-- Shield icon (threat/security) -->
  <path d="M32 16 L20 22 L20 34 C20 43 28 50 32 52 C36 50 44 43 44 34 L44 22 Z"
        fill="none" stroke="url(#icon)" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Exclamation mark inside shield -->
  <line x1="32" y1="27" x2="32" y2="37" stroke="url(#icon)" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="32" cy="41.5" r="1.8" fill="url(#icon)"/>

  <!-- Threat dots on canvas -->
  <circle cx="20" cy="32" r="2.5" fill="url(#dot1)" opacity="0.9"/>
  <circle cx="44" cy="20" r="2.5" fill="url(#dot1)" opacity="0.9"/>
  <circle cx="40" cy="44" r="2" fill="url(#dot1)" opacity="0.7"/>

  <!-- Subtle connection lines -->
  <line x1="22" y1="31" x2="30" y2="24" stroke="#8B5CF6" stroke-width="1.2" opacity="0.5" stroke-dasharray="2,2"/>
  <line x1="42" y1="21" x2="37" y2="26" stroke="#8B5CF6" stroke-width="1.2" opacity="0.5" stroke-dasharray="2,2"/>
</svg>